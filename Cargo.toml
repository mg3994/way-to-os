[package]
name = "content-moderation-system"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web framework and async runtime
axum = "0.7"
tokio = { version = "1.0", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Image processing
image = "0.24"
imageproc = "0.23"

# Video processing (placeholder - will implement with ffmpeg or similar)
# opencv = { version = "0.88", default-features = false, features = ["imgproc", "imgcodecs", "videoio"] }

# Configuration
config = "0.14"
dotenvy = "0.15"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Regex and text processing
regex = "1.10"
unicode-segmentation = "1.10"

# Async utilities
futures = "0.3"

# HTTP client for health checks
reqwest = { version = "0.11", features = ["json"] }

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# UUID for request tracking
uuid = { version = "1.0", features = ["v4", "serde"] }

# Concurrent collections
dashmap = "5.5"

# Async traits
async-trait = "0.1"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.8"